# Verity - neoforge.mods.toml  (static values; no Gradle templating)
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/kylevoluu-hue/horror-mods-by-kyluua/issues"

[[mods]]
modId = "verity"
version = "1.0.0"
displayName = "Verity"
authors = "kyluua"
description = "A psychological horror companion mod. Verity starts as a friendly floating smiley AI and slowly turns into something else."
logoFile = "verity_logo.png"

# --- Dependencies ------------------------------------------------------------
[[dependencies.verity]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.verity]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# GeckoLib powers Verity's 3D models + animations. Players/servers must install it.
[[dependencies.verity]]
modId = "geckolib"
type = "required"
versionRange = "[4.6,)"
ordering = "AFTER"
side = "BOTH"
