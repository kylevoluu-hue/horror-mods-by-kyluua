# Verity - mods.toml
# Placeholders wrapped in ${...} are filled in by build.gradle from gradle.properties.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/kylevoluu-hue/horror-mods-by-kyluua/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
logoFile = "verity_logo.png"

# --- Dependencies ------------------------------------------------------------
[[dependencies.${mod_id}]]
modId = "forge"
type = "required"
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# GeckoLib powers Verity's 3D models + animations. Players/servers must install it.
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "${geckolib_version_range}"
ordering = "AFTER"
side = "BOTH"
