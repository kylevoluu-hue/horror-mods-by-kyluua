// =============================================================================
//  Verity - build.gradle  (NeoForge)
//  Minecraft 1.21.1 / NeoForge 21.1.x / ModDevGradle 2 / Java 21
//  Animations powered by GeckoLib.
//
//  Produces a single standard NeoForge mod jar:
//    build/libs/verity-neoforge-1.21.1-<version>.jar
//  GeckoLib is NOT bundled - it stays a separate required download.
// =============================================================================
plugins {
    // ModDevGradle: the modern NeoForge mod build toolchain.
    id 'net.neoforged.moddev' version '2.0.123'
    id 'idea'
    id 'eclipse'
}

version = "${mod_version}"
group   = "${mod_group_id}"

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Mojang ships Java 21 with 1.21.1 - the mod must compile and run on it.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // GeckoLib (3D model + animation engine) is distributed through Cloudsmith.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}

neoForge {
    // The NeoForge version provides Minecraft + the mod loader at compile/run time.
    version = "${neoforge_version}"

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // GeckoLib for NeoForge - powers Verity's 3D models + animations.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

// Expand placeholders in neoforge.mods.toml (modid, version, dependency ranges).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neoforge_version        : neoforge_version,
            neoforge_version_range  : neoforge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            geckolib_version_range  : geckolib_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors
        ])
    }
}
