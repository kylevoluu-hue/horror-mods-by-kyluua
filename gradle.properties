# =============================================================================
#  Verity - gradle.properties  (NeoForge)
#  Central place for every version + metadata value used by build.gradle and
#  neoforge.mods.toml. Bump these when updating Minecraft / NeoForge / GeckoLib.
# =============================================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# --- Minecraft / NeoForge ----------------------------------------------------
minecraft_version=1.21.1
# Accept any 1.21.1 patch.
minecraft_version_range=[1.21.1,1.21.2)
# NeoForge for Minecraft 1.21.1 (21.1.x line).
neoforge_version=21.1.93
neoforge_version_range=[21.1,)
# FML loader version range (permissive).
loader_version_range=[1,)

# --- GeckoLib (3D model + animation engine) ----------------------------------
# Latest GeckoLib for NeoForge 1.21.1.
geckolib_version=4.8.4
geckolib_version_range=[4.6,)

# --- Mod metadata ------------------------------------------------------------
mod_id=verity
mod_name=Verity
mod_version=1.0.0
mod_group_id=com.kyluua.verity
mod_authors=kyluua
mod_license=MIT
mod_description=A psychological horror companion mod. Verity starts as a friendly floating smiley AI and slowly turns into something else.
