# =============================================================================
#  Verity - gradle.properties
#  Central place for every version + metadata value used by build.gradle and
#  mods.toml. Bump these when updating Minecraft / Forge / GeckoLib.
# =============================================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# --- Minecraft / Forge -------------------------------------------------------
minecraft_version=1.21.1
# Accept any 1.21.1 patch.
minecraft_version_range=[1.21.1,1.21.2)
# Recommended Forge build for 1.21.1.
forge_version=52.1.0
forge_version_range=[52,)
loader_version_range=[52,)

# --- GeckoLib (3D model + animation engine) ----------------------------------
# Dynamic 4.7.x so the build grabs the latest compatible 1.21.1 release.
geckolib_version=4.7.+
geckolib_version_range=[4.7,)

# --- Mod metadata ------------------------------------------------------------
mod_id=verity
mod_name=Verity
mod_version=1.0.0
mod_group_id=com.kyluua.verity
mod_authors=kyluua
mod_license=MIT
mod_description=A psychological horror companion mod. Verity starts as a friendly floating smiley AI and slowly turns into something else.
