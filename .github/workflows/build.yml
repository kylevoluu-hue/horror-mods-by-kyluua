name: Build

# Compiles the mod on every push / PR and uploads the resulting jar as a
# downloadable workflow artifact (Actions tab -> a run -> Artifacts), so there
# is always a fresh build to grab even before a tagged release exists.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Provisions Gradle 8.8 and puts `gradle` on PATH, so we don't need to
      # commit the gradle-wrapper.jar binary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: verity-jar
          path: build/libs/*.jar
          if-no-files-found: error
