name: Build

# Compiles the mod in the cloud (GitHub-hosted runner, full internet). On a
# successful build it BOTH:
#   - uploads the jar as a run artifact, and
#   - publishes/updates a downloadable "latest" release with the jar attached,
#     so you can grab verity-forge-*.jar straight from the Releases page with
#     no building on your end.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the rolling release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verity-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Publish a rolling "latest" release with the jar so it is directly
      # downloadable. Only runs on pushes to the Verity dev branch.
      - name: Publish latest release
        if: success() && github.event_name == 'push' && github.ref_name == 'claude/verity-minecraft-horror-mod-z0bjx8'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Verity (latest build)
          body: Auto-built jar from the newest commit. Requires GeckoLib 4.8.x for Forge 1.21.1.
          prerelease: true
          files: build/libs/*.jar
