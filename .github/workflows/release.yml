name: Release

# Builds the mod and publishes a GitHub Release with the jar attached.
# Trigger it either by:
#   - pushing a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
#   - or running it manually from the Actions tab (provide a tag name).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Verity ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: build/libs/*.jar
